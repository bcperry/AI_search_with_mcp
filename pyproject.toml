[project]
name = "ai-search-with-mcp"
version = "0.1.0"
description = "FastMCP server for Azure AI Search hybrid semantic and vector retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-identity>=1.25.1",
    "azure-search-documents>=11.6.0",
    "azure-storage-blob>=12.28.0",
    "fastmcp>=2.12.4",
    "openai>=2.44.0",
    "PyMuPDF>=1.26.0",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "pandas>=2.3.3",
]
