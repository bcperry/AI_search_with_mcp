# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json
name: ai-search-mcp
metadata:
  template: ai-search-mcp
infra:
  provider: bicep
  path: infra
services:
  mcp:
    project: .
    language: python
    host: appservice
hooks:
  postdeploy:
    shell: sh
    run: uv run python scripts/seed_search.py --configure-only
